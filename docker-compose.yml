
services:
  # 1. PostgreSQL: The Permanent Ledger & Identity Store
  postgres:
    image: postgres:15-alpine
    container_name: boundless-postgres
    environment:
      POSTGRES_USER: boundless_admin
      POSTGRES_PASSWORD: boundless_password
      POSTGRES_DB: boundless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Redis: The Fast Path (Idempotency, Budgets, Velocity tracking)
  redis:
    image: redis:7-alpine
    container_name: boundless-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # 3. Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: boundless-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 4. Kafka: The Async Backbone (Settlements, Auth Events)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: boundless-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 5. Zipkin: Distributed Tracing for Observability
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: boundless-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

volumes:
  postgres_data:
